services:
  linux-server-admin:
    build: .
    image: linux-server-admin:latest
    container_name: linux-server-admin
    restart: unless-stopped
    privileged: true
    pid: host
    ports:
      - "${PORT:-8888}:80"
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_NAME=${SERVER_NAME:-Linux Server Admin}
      - WEB_USER=${WEB_USER:-admin}
      - WEB_PASSWORD=${WEB_PASSWORD:-admin}
      - DISABLE_AUTH=${DISABLE_AUTH:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      # Permite gerenciar todos os containers do servidor host
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/os-release:/host/os-release:ro
      # Dados persistentes (servicos salvos, historico, config)
      - ./data:/data
      # Configuracoes do Nginx interno e senhas (.htpasswd)
      - ./config:/config
      - ./app/frontend:/app/frontend:ro
      - ./app/backend:/app/backend:ro
      - ./entrypoint.sh:/entrypoint.sh

  server-telegram-bot:
    build: .
    image: linux-server-admin:latest
    container_name: server-telegram-bot
    restart: unless-stopped
    privileged: true
    pid: host
    entrypoint: ["python3", "-u", "/app/backend/telegram_bot.py"]
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_NAME=${SERVER_NAME:-Linux Server Admin}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      # Permite monitorar eventos e reiniciar containers do host
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/os-release:/host/os-release:ro
      # Compartilha credenciais e configuracoes
      - ./data:/data
      - ./app/backend:/app/backend:ro